<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR Intake Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: a red bar with a gold rule switches four views; the request view is a step rail beside one form panel,
   the team views are summary first, then tables that scroll inside their own frame.
   Yellow marks what the requestor told us, blue marks what the data team added, as in the team's workbook. */
:root {
  --bg: #F5F3F1;
  --surface: #FFFFFF;
  --surface-2: #EBE7E3;
  --ink: #221E1C;
  --muted: #655D58;
  --line: #DBD5CF;
  --line-strong: #B8AFA8;
  --accent: #C5161F;
  --accent-fill: #D71E28;
  --accent-ink: #FFFFFF;
  --head: #D71E28;
  --head-ink: #FFFFFF;
  --gold: #FFCD41;
  --gold-ink: #221E1C;
  --sel: #FFF3CC;
  --sel-line: #B98A00;
  --req: #FFE9A6;
  --req-ink: #6A4900;
  --team: #D7E5F6;
  --team-ink: #1D4B77;
  --good: #1B7A4B;
  --good-soft: #DFF3E8;
  --warn: #99480A;
  --warn-soft: #FCE6D3;
  --crit: #A8131B;
  --crit-soft: #FBE3E4;
  --bar: #5A514C;
  --font-display: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151211; --surface: #201C1A; --surface-2: #2C2724; --ink: #F2EDE9; --muted: #B3A9A2;
    --line: #3A3330; --line-strong: #564D48; --accent: #FF8086; --accent-fill: #D71E28; --accent-ink: #FFFFFF;
    --head: #B3161E; --head-ink: #FFFFFF; --gold: #FFCD41; --gold-ink: #221E1C; --sel: #3B2F0E; --sel-line: #D6A419;
    --req: #45370F; --req-ink: #FFD970; --team: #1B3148; --team-ink: #B9D4F1;
    --good: #62C794; --good-soft: #143524; --warn: #F2A96C; --warn-soft: #41270F;
    --crit: #FF9497; --crit-soft: #4A1719; --bar: #CFC5BE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151211; --surface: #201C1A; --surface-2: #2C2724; --ink: #F2EDE9; --muted: #B3A9A2;
  --line: #3A3330; --line-strong: #564D48; --accent: #FF8086; --accent-fill: #D71E28; --accent-ink: #FFFFFF;
  --head: #B3161E; --head-ink: #FFFFFF; --gold: #FFCD41; --gold-ink: #221E1C; --sel: #3B2F0E; --sel-line: #D6A419;
  --req: #45370F; --req-ink: #FFD970; --team: #1B3148; --team-ink: #B9D4F1;
  --good: #62C794; --good-soft: #143524; --warn: #F2A96C; --warn-soft: #41270F;
  --crit: #FF9497; --crit-soft: #4A1719; --bar: #CFC5BE;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ol, ul, fieldset, legend { margin: 0; padding: 0; }
fieldset { border: 0; min-width: 0; }
ol, ul { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bar :focus-visible { outline-color: var(--gold); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--head); color: var(--head-ink);
}
.bar-in {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { display: grid; grid-template-columns: 9px 9px; gap: 2px; }
.brand-mark i { width: 9px; height: 9px; border-radius: 2px; background: var(--head-ink); }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { background: var(--gold); }
.brand-name { font: 600 16px/1.2 var(--font-display); }
.brand-sub { font-size: 12px; opacity: .9; }
.bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.role-sw { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.role:disabled { opacity: .5; cursor: default; }
.userbox { position: relative; }
.avatar { display: inline-grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font: 600 12px var(--font-body); letter-spacing: .02em; }
.avatar-lg { width: 44px; height: 44px; font-size: 15px; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 4px; border-radius: 999px; cursor: pointer; text-align: left;
  border: 1px solid color-mix(in srgb, var(--head-ink) 60%, transparent); background: color-mix(in srgb, var(--head-ink) 12%, transparent); color: var(--head-ink); }
.user-chip:hover { background: color-mix(in srgb, var(--head-ink) 22%, transparent); }
.user-id { display: flex; flex-direction: column; line-height: 1.15; }
.user-id b { font-weight: 600; font-size: 13px; }
.user-id small { font-size: 11px; opacity: .9; }
.caret { font-size: 11px; }
.user-out { font-size: 13px; opacity: .9; }
.user-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(320px, calc(100vw - 32px)); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 22%, transparent); }
.user-menu :focus-visible { outline-color: var(--ink); }
.user-head { display: flex; align-items: center; gap: 12px; }
.user-head > div { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.user-facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.user-facts dt { color: var(--muted); }
.user-facts dd { margin: 0; }
.user-list { display: flex; flex-direction: column; gap: 4px; }
.user-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; text-align: left; }
.user-opt:hover { background: var(--surface-2); }
.user-opt[aria-pressed="true"] { background: var(--sel); border-color: var(--sel-line); }
.user-opt span:last-child { display: flex; flex-direction: column; line-height: 1.2; }
.user-opt b { font-weight: 600; font-size: 14px; }
.user-opt small { font-size: 12px; color: var(--muted); }
.whoami { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--bg); }
.whoami-text { display: flex; flex-direction: column; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.signin { align-items: center; text-align: center; max-width: 520px; margin: 40px auto; }
.signin h1 { font: 600 24px/1.2 var(--font-display); }
.role-lab { font-size: 12px; opacity: .9; margin-right: 2px; }
.role {
  border: 1px solid color-mix(in srgb, var(--head-ink) 60%, transparent); background: none; color: var(--head-ink);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px;
}
.role:hover { background: color-mix(in srgb, var(--head-ink) 18%, transparent); }
.role[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.tabbar { border-top: 4px solid var(--gold); background: var(--req); color: var(--req-ink); border-bottom: 1px solid var(--line); }
.tabbar[data-role="team"] { background: var(--team); color: var(--team-ink); }
.tabbar :focus-visible { outline-color: var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; max-width: 1180px; margin: 0 auto; padding: 6px 20px; }
.tab {
  border: 1px solid transparent; background: none; padding: 5px 12px; border-radius: var(--r);
  cursor: pointer; font-weight: 500; font-size: 14px; color: inherit;
}
.tab:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.tab .count { font: 500 12px var(--font-mono); margin-left: 6px; }

/* ---------- page frame ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.view-head { display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.view-head h1 { font: 600 26px/1.2 var(--font-display); text-wrap: balance; }
.view-head p { color: var(--muted); }
.eyebrow { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h2 { font: 600 19px/1.25 var(--font-display); text-wrap: balance; }
h3 { font: 600 15px/1.3 var(--font-body); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
.btn-primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.btn-quiet { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn-quiet:hover { background: var(--sel); border-color: transparent; }
.btn-danger:hover { border-color: var(--crit); color: var(--crit); background: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- survey ---------- */
.survey { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 124px); display: flex; flex-direction: column; gap: 16px; }
.steps { display: flex; flex-direction: column; gap: 2px; counter-reset: step; }
.step {
  counter-increment: step; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center;
  width: 100%; text-align: left; border: 0; background: none; padding: 8px; border-radius: var(--r); cursor: pointer; color: var(--muted);
}
.step::before {
  content: counter(step); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line-strong); font: 500 12px var(--font-mono); color: var(--muted); background: var(--surface);
}
.step:hover { background: var(--surface-2); }
.step[aria-current="step"] { color: var(--ink); font-weight: 600; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.step[aria-current="step"]::before { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
.step.done::before { content: "\2713"; background: var(--good-soft); border-color: var(--good); color: var(--good); }
.step small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.rail-note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel-head { display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.panel-head p { color: var(--muted); }
.panel-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px; border-radius: var(--r); background: var(--sel); color: var(--ink); font-size: 14px; }
.banner strong { font-weight: 600; }
.note { padding: 10px 14px; border-radius: var(--r); background: var(--surface-2); color: var(--ink); font-size: 14px; }
.note-team { background: var(--team); color: var(--team-ink); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.f-wide { grid-column: 1 / -1; }
.f > label, .f > legend { font-weight: 500; font-size: 14px; }
.opt { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
.hint { font-size: 13px; color: var(--muted); }
.f input[type="text"], .f input[type="email"], .f input[type="date"], .f select, .f textarea, .cell-in {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); min-width: 0;
}
.f textarea { resize: vertical; min-height: 64px; }
.f input:hover, .f select:hover, .f textarea:hover { border-color: var(--muted); }
.f-bad input, .f-bad select, .f-bad textarea, .f-bad .choices { border-color: var(--crit); }
.f-bad .choices { box-shadow: inset 3px 0 0 var(--crit); padding-left: 10px; }
.err { font-size: 13px; color: var(--crit); font-weight: 500; }
.choices { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.choices.stack { flex-direction: column; }
.choice { display: inline-flex; align-items: flex-start; gap: 7px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); cursor: pointer; font-size: 14px; background: var(--surface); }
.choice:hover { border-color: var(--muted); }
.choice input { margin: 3px 0 0; accent-color: var(--accent-fill); }
.choice:has(input:checked) { background: var(--sel); border-color: var(--sel-line); }

/* source and element blocks */
.block { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; background: var(--surface-2); border-radius: 8px 8px 0 0; }
.block-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
.block-title .n { font: 500 12px var(--font-mono); color: var(--muted); }
.block-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.sub { border-top: 1px dashed var(--line-strong); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.el { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.el-n { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 28px; }
.el-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.keyset { background: var(--bg); border-radius: var(--r); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.keyset-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }
.keyset-h b { font-weight: 600; font-size: 14px; }
.key-in { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.5fr); gap: 8px 10px; align-items: end; }
.key-in .f > label { font-weight: 400; font-size: 12px; color: var(--muted); }
.f input.mono { font-family: var(--font-mono); font-size: 13px; }
.keytext { overflow-wrap: anywhere; }
table.els td:first-child { min-width: 190px; }
table.els td:nth-child(2) { min-width: 150px; }
table.els td:nth-child(5) { min-width: 150px; }
table.els .stack { min-width: 200px; }
table.els .key4-in { max-width: 330px; }
.stack { display: flex; flex-direction: column; gap: 6px; min-width: 250px; }
.upload { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
.upload-text { display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px; min-width: 0; max-width: 66ch; }
.btn-file { position: relative; }
.btn-file:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.el-edit { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
.bulk { border: 1px solid var(--line-strong); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.bulk-head { display: flex; flex-direction: column; gap: 2px; }
.bulk-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: bulk; }
.bulk-steps li { counter-increment: bulk; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border-radius: var(--r); background: var(--bg); }
.bulk-steps li > b::before { content: counter(bulk) ". "; font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.bulk-steps .btn { margin-top: auto; }
.bulk-result { display: flex; flex-direction: column; gap: 6px; }
table.pde td { vertical-align: middle; }
table.pde { table-layout: fixed; min-width: 720px; }
table.pde th:nth-child(1) { width: 48px; }
table.pde th:nth-child(2) { width: 24%; }
table.pde th:nth-child(3) { width: 26%; }
table.pde th:nth-child(4) { width: 116px; }
table.pde th:nth-child(6) { width: 140px; }
table.pde td { overflow-wrap: anywhere; }
table.pde tr.bad > td { background: var(--crit-soft); }
table.pde tr.edit-row > td { background: var(--bg); padding: 14px; }
table.pde .btn-quiet { padding: 4px 8px; }

/* worked comparison */
.compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.compare > div { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.compare dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; }
.compare dt { color: var(--muted); }
.compare dd { margin: 0; overflow-wrap: anywhere; }
.quote { font: 500 15px/1.4 var(--font-display); }

/* ---------- chips, pills, meters ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink); }
.chip-req { background: var(--req); color: var(--req-ink); }
.chip-team { background: var(--team); color: var(--team-ink); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-crit { background: var(--crit-soft); color: var(--crit); }
.meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.meter-track { flex: 1 1 120px; max-width: 220px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; background: var(--bar); }
.meter b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line-strong); }
.sw-req { background: var(--req); } .sw-team { background: var(--team); }

/* ---------- review ---------- */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
.kv { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kv span { font-size: 12px; color: var(--muted); }
.kv b { font-weight: 500; overflow-wrap: anywhere; }
.qgroups { columns: 320px 3; column-gap: 28px; }
.qgroup { break-inside: avoid; padding-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
.qgroup h4 { font: 600 13px/1.4 var(--font-body); }
.qgroup ul { display: flex; flex-direction: column; gap: 5px; }
.qgroup li { font-size: 14px; padding-left: 14px; position: relative; }
.qgroup li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
.done-card { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.req-id { font: 500 14px var(--font-mono); }

/* ---------- team views ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 600 26px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.scroll { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-weight: 600; font-size: 12.5px; white-space: nowrap; background: var(--surface-2); }
tbody tr:last-child > td { border-bottom: 0; }
th.c-req, tr.grp th.c-req { background: var(--req); color: var(--req-ink); }
th.c-team, tr.grp th.c-team { background: var(--team); color: var(--team-ink); }
tr.grp th { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding-block: 5px; }
td.c-team { background: color-mix(in srgb, var(--team) 35%, transparent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.row-btn { cursor: pointer; }
.row-btn:hover > td { background: var(--sel); }
tr[aria-selected="true"] > td { background: var(--sel); box-shadow: inset 0 1px 0 var(--sel-line), inset 0 -1px 0 var(--sel-line); }
.cell-in { padding: 5px 8px; font-size: 13px; min-width: 130px; }
input.cell-in.mono { font-family: var(--font-mono); min-width: 110px; }
.nowrap { white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.detail { display: flex; flex-direction: column; gap: 18px; }
.detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: flex-start; }
.detail-head > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.told { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 24px; }
.panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pane { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pane-req { background: color-mix(in srgb, var(--req) 45%, var(--surface)); }
.pane-team { background: color-mix(in srgb, var(--team) 45%, var(--surface)); }
.pane-req .eyebrow { color: var(--req-ink); } .pane-team .eyebrow { color: var(--team-ink); }
.pane .told { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.pane .cell-in { min-width: 0; font-size: 14px; padding: 7px 10px; }
.src-btn { padding: 2px 6px; margin-left: -6px; text-align: left; white-space: nowrap; }
table.pin tbody td:first-child, table.pin thead tr:not(.grp) th:first-child { position: sticky; left: 0; z-index: 1; }
table.pin tbody td:first-child { background: var(--surface); min-width: 150px; }
table.pin th, table.pin td { padding-inline: 9px; }
table.pin tbody tr[aria-selected="true"] td:first-child, table.pin tbody tr.row-btn:hover td:first-child { background: var(--sel); }
.key4-in { display: grid; grid-template-columns: repeat(2, minmax(118px, 1fr)); gap: 6px; min-width: 244px; }
.key4-in .cell-in { min-width: 0; }
.compare .chip { align-self: flex-start; }
.note-crit { background: var(--crit-soft); color: var(--crit); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.demand-bar { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.demand-bar i { display: block; height: 10px; border-radius: 0 4px 4px 0; background: var(--bar); }
.demand-bar b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- disclosures, guide, how to use ---------- */
details.held, details.guide { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details > summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+"; font: 500 15px var(--font-mono); width: 14px; color: var(--muted); }
details[open] > summary::before { content: "\2212"; }
details.held .scroll { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }
.guide-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 32px; padding: 4px 16px 16px 38px; }
.guide-body ol { list-style: decimal; padding-left: 18px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.guide-body ol b { color: var(--ink); font-weight: 600; }
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px 4px; }
.flow li { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chev { padding: 10px 18px 10px 24px; min-height: 62px; display: flex; flex-direction: column; justify-content: center; font-weight: 600; line-height: 1.25;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); }
.flow li:first-child .chev { padding-left: 14px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
.chev small { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.chev.you { background: var(--req); color: var(--req-ink); }
.chev.team { background: var(--team); color: var(--team-ink); }
.chev.both { background: var(--surface-2); color: var(--ink); }
.flow p { font-size: 14px; color: var(--muted); padding-right: 14px; }
.tips { list-style: disc; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); max-width: 70ch; }
.card .stats .stat { background: var(--bg); border: 0; }

td.pre { white-space: pre-line; min-width: 240px; }
tr.unconf > td:not(.c-team), .pane-req.unconf .kv b { font-style: italic; }
.chip.mono { font-family: var(--font-mono); font-size: 12px; font-style: normal; }
table.wgl td:nth-child(2) { background: color-mix(in srgb, var(--crit-soft) 55%, transparent); }
table.wgl td:nth-child(3) { background: color-mix(in srgb, var(--good-soft) 55%, transparent); }
table.wgl td:nth-child(1) { white-space: nowrap; }
table.wgl td, table.deftab td { min-width: 150px; }
table.deftab td.c-reqcell { background: color-mix(in srgb, var(--req) 45%, transparent); }
table.deftab td:first-child { white-space: nowrap; }
.card > h3 { margin-top: 4px; }

/* ---------- definitions ---------- */
.defs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.def { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.def dt { font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.def dd { margin: 0; color: var(--muted); max-width: 60ch; }
.roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.roles > div { padding: 14px 16px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
.role-req { background: var(--req); color: var(--req-ink); }
.role-team { background: var(--team); color: var(--team-ink); }
.key4 { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font: 500 13px var(--font-mono); }
.key4 span { padding: 2px 8px; border: 1px solid currentColor; border-radius: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .survey { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .steps { flex-direction: row; flex-wrap: wrap; }
  .step { width: auto; grid-template-columns: 26px auto; }
  .step small { display: none; }
  .rail-note { display: none; }
  .panes, .defs, .guide-body, .flow { grid-template-columns: minmax(0, 1fr); }
  .guide-body { padding-left: 16px; }
  .flow .chev, .flow li:first-child .chev { clip-path: none; border-radius: var(--r); padding: 10px 14px; min-height: 0; }
}
@media (max-width: 620px) {
  .bar-in, .wrap, .tabs { padding-inline: 16px; }
  .bar { position: static; }
  .bar-in { position: relative; }
  .userbox { position: static; }
  .user-menu { left: 16px; right: 16px; top: calc(100% - 4px); width: auto; }
  .panel { padding: 16px; }
  .grid2, .grid3, .compare, .summary, .roles, .bulk-steps { grid-template-columns: minmax(0, 1fr); }
  .key-in { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .el { grid-template-columns: minmax(0, 1fr); }
  .el-n { padding-top: 0; }
  .grid2 > span:empty { display: none; }
  .step span { display: none; }
  .step[aria-current="step"] span { display: block; }
  .view-head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter-fill, .demand-bar i { transition: width .25s ease; }
}
</style>

<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div>
        <div class="brand-name">Corporate Risk Data Intake</div>
        <div class="brand-sub">Mockup with placeholder names and example data</div>
      </div>
    </div>
    <div class="bar-right">
      <div class="role-sw" role="group" aria-label="View as">
        <span class="role-lab">View as</span>
        <button type="button" class="role" id="role-req" data-role="req">Requester</button>
        <button type="button" class="role" id="role-team" data-role="team">Data plane team</button>
      </div>
      <div class="userbox" id="userbox"></div>
    </div>
  </div>
  <div class="tabbar" id="tabbar" data-role="req"><nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav></div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
  'use strict';

  /* ================= reference data: every name here is a placeholder ================= */
  const TEAMS = ['Operational Risk', 'Financial Crimes', 'Credit Risk', 'Market Risk', 'Compliance', 'Model Risk', 'Other'];
  const STAGES = [
    ['explore', 'Exploring an idea'],
    ['pilot', 'Piloting with files we load by hand'],
    ['funded', 'Funded and in build'],
    ['live', 'Live and needs a production feed']
  ];
  const CONSUMER = ['Report', 'Dashboard', 'Model', 'AI tool', 'Analytics', 'Other'];
  const AI_PROMPTS = [['yes', 'Yes, written and tested'], ['progress', 'In progress'], ['no', 'Not yet']];
  const AI_OVERSIGHT = [['yes', 'Yes'], ['no', 'Not yet']];
  const TODAY = [['manual', 'We load files by hand'], ['feed', 'From an existing feed or report'], ['none', 'We do not have it']];
  const KINDS = [['sor', 'System or application'], ['ads', 'Approved data source'], ['report', 'Report or dashboard'], ['file', 'File or spreadsheet'], ['unsure', 'Not sure']];
  const CATEGORIES = ['Customer', 'Account', 'Transaction', 'Employee', 'Issue or event', 'Loss event', 'Change or initiative', 'Application inventory', 'Third party', 'Other'];
  const PRIORITY = ['High', 'Medium', 'Low'];
  const FREQ = ['Daily', 'Weekly', 'Monthly', 'Quarterly', 'Annual', 'Ad hoc'];
  const YESNO = [['yes', 'Yes'], ['no', 'No']];
  const YESNOUNK = [['yes', 'Yes'], ['no', 'No'], ['unknown', 'Unknown']];
  const AUDIENCE = ['Board or board committee', 'Executive committee', 'Regulators', 'Risk committee', 'Internal team only'];
  const HISTORY = ['1 month', '3 months', '13 months', '24 months', '7 years'];
  const DATA_TYPES = [['snapshot', 'Snapshot at a point in time'], ['transactional', 'Transactional: every record or event'], ['both', 'Both']];
  const REG_TYPES = ['Regulation', 'Policy', 'Exam finding or regulatory commitment', 'Other'];
  const GOLDEN = [['golden', 'It is the authoritative source for this data'], ['seen', 'It is where we see the data today'], ['unsure', 'Not sure']];
  const FIELD_TYPES = [['field', 'One field'], ['summary', 'Summary of several'], ['unsure', 'Not sure']];
  const KEY_PARTS = [['db', 'Database'], ['schema', 'Schema'], ['table', 'Table'], ['element', 'Element']];

  const STATUS = ['Not started', 'In review', 'Questions sent', 'Ready to source', 'Parked'];
  const CHECK = ['Right source for these fields', 'Golden source is elsewhere', 'Not an application', 'Not found in inventory'];
  const CALL = ['Use existing platform data', 'Expand existing feed', 'Source from ADS', 'Interim SOR', 'Net new', 'Not a data source'];
  const ADS_HAS = ['Yes', 'No', 'Unknown'];
  const TEAM_CODES = { 'Operational Risk': 'OPR', 'Financial Crimes': 'FCR', 'Credit Risk': 'CRD', 'Market Risk': 'MKT', 'Compliance': 'CMP', 'Model Risk': 'MDL', 'Other': 'OTH' };
  const TEAM_PRI = ['P1', 'P2', 'P3'];
  const TARGET = ['2027 Q1', '2027 Q2', '2027 H2', 'Not scheduled'];
  const NEED = [['required', 'Required'], ['nice', 'Nice-to-have']];
  const SOURCED = ['Yes', 'No', 'Unknown'];
  const GAPS = ['None; already sourced', 'Ask for a screenshot or system extract', 'Ask where they pull it today', 'Check with the source or ADS team', 'Add to the existing feed', 'Net new sourcing'];

  const CATALOG = [
    { id: 'A', appId: 'APP-10001', name: 'Source A', desc: 'Customer master', kind: 'sor', platforms: ['Platform 1', 'Platform 2'], fields: 38, ads: { name: 'ADS 1', when: 'Live' },
      held: { db: 'platform1_db', schema: 'cust', table: 'customer_master', cols: [['legal_nm', 'Customer legal name'], ['cust_type_cd', 'Customer type'], ['onboard_dt', 'Onboarding date'], ['risk_rating_cd', 'Risk rating'], ['domicile_ctry_cd', 'Country of domicile'], ['status_cd', 'Customer status']] } },
    { id: 'B', appId: 'APP-10002', name: 'Source B', desc: 'Deposit accounts', kind: 'sor', platforms: ['Platform 1'], fields: 54, ads: { name: 'ADS 2', when: '2029-Q1' },
      held: { db: 'platform1_db', schema: 'dep', table: 'account', cols: [['acct_id', 'Account ID'], ['open_dt', 'Account open date'], ['status_cd', 'Account status'], ['prod_cd', 'Product code'], ['avg_bal_amt', 'Average balance'], ['od_flag', 'Overdraft flag']] } },
    { id: 'C', appId: 'APP-10003', name: 'Source C', desc: 'Auto lending', kind: 'sor', platforms: ['Platform 1'], fields: 27, ads: { name: 'ADS 3', when: 'Live' },
      held: { db: 'platform1_db', schema: 'auto', table: 'loan_master', cols: [['loan_id', 'Loan ID'], ['borrower_cust_id', 'Borrower customer ID'], ['orig_dt', 'Origination date'], ['dpd_cnt', 'Days past due'], ['pmt_status_cd', 'Payment status'], ['curr_bal_amt', 'Current balance']] } },
    { id: 'D', appId: 'APP-10004', name: 'Source D', desc: 'Application registry', kind: 'sor', platforms: ['Platform 3'], fields: 19, ads: null,
      held: { db: 'platform3_db', schema: 'reg', table: 'application', cols: [['app_id', 'Application ID'], ['app_nm', 'Application name'], ['owner_emp_id', 'Application owner'], ['go_live_dt', 'Go-live date'], ['change_init_id', 'Change initiative ID'], ['criticality_cd', 'Criticality']] } },
    { id: 'E', appId: 'APP-10005', name: 'Source E', desc: 'Issues and defects', kind: 'sor', platforms: ['Platform 3'], fields: 23, ads: null,
      held: { db: 'platform3_db', schema: 'grc', table: 'issue', cols: [['issue_id', 'Issue ID'], ['status_cd', 'Issue status'], ['open_dt', 'Date opened'], ['due_dt', 'Due date'], ['severity_cd', 'Severity'], ['owner_emp_id', 'Issue owner']] } },
    { id: 'F', appId: 'APP-10006', name: 'Source F', desc: 'Loss events', kind: 'sor', platforms: [], fields: 0, ads: { name: 'ADS 4', when: '2028-Q3' } },
    { id: 'G', appId: 'APP-10007', name: 'Source G', desc: 'Third-party inventory', kind: 'sor', platforms: [], fields: 0, ads: null },
    { id: 'H', appId: 'APP-10008', name: 'Source H', desc: 'Executive risk dashboard', kind: 'report', platforms: [], fields: 0, ads: null }
  ];
  const adsLabel = c => (c && c.ads ? c.ads.name + ' · ' + c.ads.when : 'No aligned ADS');
  const cat = id => CATALOG.find(c => c.id === id);
  const labelOf = (list, v) => { const hit = list.find(o => (Array.isArray(o) ? o[0] : o) === v); return hit ? (Array.isArray(hit) ? hit[1] : hit) : ''; };

  /* ================= model ================= */
  let seq = 0;
  const nid = p => p + (++seq);

  function newElement(o) {
    o = o || {};
    return Object.assign({ id: nid('e'), name: '', definition: '', why: '', population: '', example: '', need: '', fieldType: '' }, o, {
      key: Object.assign({ db: '', schema: '', table: '', element: '' }, o.key),
      t: Object.assign({ db: '', schema: '', table: '', element: '', sourced: '', gap: '', notes: '' }, o.t)
    });
  }
  function newSource(o) {
    o = o || {};
    const src = Object.assign({
      id: nid('s'), catalog: '', name: '', appId: '', kind: '', categories: [], useCase: '', priority: '', priorityWhy: '', frequency: '',
      dataType: '', consumer: '', neededBy: '', regulatory: '', regType: '', regDetail: '', reporting: '', audience: [], reportName: '', history: '', historyDepth: '',
      golden: '', sme: '', samples: '', unknownFields: false, describe: '', uploadError: ''
    }, o, {
      elements: (o.elements || []).map(newElement), files: (o.files || []).slice(),
      t: Object.assign({ reqId: '', held: '', platform: '', others: '', adsHas: '', adsName: '', adsDate: '', call: '', status: '', next: '', check: '', pri: '', target: '' }, o.t)
    });
    if (!src.appId && CATALOG.some(c => c.id === src.catalog)) src.appId = CATALOG.find(c => c.id === src.catalog).appId;
    return src;
  }
  function newRequest(o) {
    o = o || {};
    return Object.assign({
      id: '', example: false, channel: 'survey', submitted: '', status: 'Not started', title: '', team: '', requester: '', email: '',
      initiative: '', outcome: '', stage: '', aiPrompts: '', aiOversight: '', today: '', tomorrow: '', sel: 0
    }, o, { sources: (o.sources || []).map(newSource) });
  }

  const filled = v => Array.isArray(v) ? v.length > 0 : String(v == null ? '' : v).trim() !== '';
  const els = s => s.unknownFields ? [] : s.elements;
  const srcName = s => { const c = cat(s.catalog); return c ? c.name : (s.name.trim() || 'Unnamed source'); };
  const srcDesc = s => { const c = cat(s.catalog); return c ? c.desc : (s.catalog === 'other' ? 'Not in our inventory' : ''); };
  const srcKey = s => cat(s.catalog) ? s.catalog : 'other:' + s.name.trim().toLowerCase();
  const isReport = s => s.kind === 'report' || (cat(s.catalog) || {}).kind === 'report';
  const platformsOf = s => (cat(s.catalog) || { platforms: [] }).platforms;
  const keyCount = e => KEY_PARTS.filter(([k]) => filled(e.key[k])).length;
  const elName = e => e.name.trim() || e.key.element.trim() || (e.key.table.trim() ? 'Table ' + e.key.table.trim() : 'Unnamed element');
  const keyText = k => KEY_PARTS.map(([part]) => k[part].trim() || '?').join('.');
  const carryKey = e => KEY_PARTS.forEach(([k]) => { if (!e.t[k]) e.t[k] = e.key[k].trim(); });

  const consumersOf = r => [...new Set(r.sources.map(s => s.consumer).filter(Boolean))];
  const usesAI = r => r.sources.some(s => s.consumer === 'AI tool');
  const earliest = r => r.sources.map(s => s.neededBy).filter(Boolean).sort()[0] || '';
  const inPlatforms = s => { const c = cat(s.catalog); return c ? (c.platforms.length ? 'Yes' : 'No') : 'Unknown'; };

  function suggestCall(s) {
    const c = cat(s.catalog);
    if (isReport(s)) return 'Not a data source';
    if (platformsOf(s).length) return 'Use existing platform data';
    if (!els(s).length) return '';
    if (c && c.ads && c.ads.when === 'Live') return 'Source from ADS';
    return 'Net new';
  }
  function teamDefaults(s) {
    const c = cat(s.catalog);
    if (!s.t.call) s.t.call = suggestCall(s);
    if (!s.t.held) s.t.held = inPlatforms(s);
    if (!s.t.platform && c) s.t.platform = c.platforms.join('; ');
    if (!s.t.adsHas) s.t.adsHas = c ? (c.ads ? 'Yes' : 'No') : 'Unknown';
    if (c && c.ads) { if (!s.t.adsName) s.t.adsName = c.ads.name; if (!s.t.adsDate) s.t.adsDate = c.ads.when; }
    s.elements.forEach(e => {
      const h = c && c.held;
      if (!e.t.sourced) {
        if (h && filled(e.key.element) && h.cols.some(col => col[0] === e.key.element.trim()) && (!filled(e.key.table) || e.key.table.trim() === h.table)) {
          e.t.sourced = 'Yes';
          if (!e.t.gap) e.t.gap = GAPS[0];
          if (!filled(e.key.db)) e.t.db = h.db;
          if (!filled(e.key.schema)) e.t.schema = h.schema;
          if (!filled(e.key.table)) e.t.table = h.table;
        } else if (c && !c.platforms.length) e.t.sourced = 'No';
      }
      carryKey(e);
    });
  }
  /* The data plane team gives every source row a request ID, TEAM-###, that ties it to its PDE rows. */
  const rowSeq = {};
  function prepRequest(r) {
    const code = TEAM_CODES[r.team] || 'OTH';
    r.sources.forEach(s => {
      teamDefaults(s);
      if (!s.t.status) s.t.status = r.status || 'Not started';
      if (!s.t.reqId) { rowSeq[code] = (rowSeq[code] || 0) + 1; s.t.reqId = code + '-' + String(rowSeq[code]).padStart(3, '0'); }
    });
  }

  const countTeams = v => String(v || '').split(';').map(x => x.trim()).filter(Boolean).length;
  const fillOthers = r => r.sources.forEach(s => { if (!s.t.others) s.t.others = otherAreas(r, s).join('; '); });
  /* Validation lookup: check the application ID the requester gave against our platform details. */
  function lookup(s) {
    const id = s.appId.trim();
    if (!id) return { cls: 'chip-warn', text: 'No application ID to check' };
    const hit = CATALOG.find(c => c.appId.toLowerCase() === id.toLowerCase());
    if (!hit) return { cls: 'chip-crit', text: id + ': not in our platforms' };
    if (cat(s.catalog) && hit.id !== s.catalog) return { cls: 'chip-warn', text: id + ' belongs to ' + hit.name + ', not the source named' };
    return hit.platforms.length ? { cls: 'chip-good', text: id + ': in our platforms (' + hit.platforms.join(', ') + ')' } : { cls: 'chip-crit', text: id + ': not in our platforms' };
  }
  const statusChip = st => '<span class="chip ' + ({ 'In review': 'chip-team', 'Questions sent': 'chip-warn', 'Ready to source': 'chip-good' }[st] || '') + '">' + st + '</span>';
  const rollup = r => STATUS.map(st => [st, r.sources.filter(s => s.t.status === st).length]).filter(x => x[1]).map(x => '<span class="chip ' + ({ 'In review': 'chip-team', 'Questions sent': 'chip-warn', 'Ready to source': 'chip-good' }[x[0]] || '') + '">' + x[1] + ' ' + x[0] + '</span>').join('');

  /* One checklist drives step validation, the completeness meter and the follow-up questions. */
  function checklist(r) {
    const c = [];
    const add = (step, path, ok, soft) => c.push({ step, path, ok: !!ok, soft: !!soft });
    ['title', 'team', 'requester', 'email', 'initiative'].forEach(k => add(0, k, filled(r[k])));
    ['outcome', 'stage', 'today', 'tomorrow'].forEach(k => add(1, k, filled(r[k])));
    add(2, 'sources', r.sources.length > 0);
    r.sources.forEach((s, i) => {
      const p = 'sources.' + i + '.';
      add(2, p + 'catalog', filled(s.catalog));
      if (s.catalog === 'other') add(2, p + 'name', filled(s.name));
      ['kind', 'categories', 'useCase', 'priority', 'priorityWhy', 'frequency', 'dataType', 'consumer', 'golden', 'regulatory', 'reporting', 'history'].forEach(k => add(2, p + k, filled(s[k])));
      if (s.regulatory === 'yes') { add(2, p + 'regType', filled(s.regType)); add(2, p + 'regDetail', filled(s.regDetail)); }
      if (s.reporting === 'yes') add(2, p + 'audience', filled(s.audience));
      if (s.history === 'yes') add(2, p + 'historyDepth', filled(s.historyDepth));
      if (s.unknownFields) {
        add(3, p + 'describe', filled(s.describe));
        add(3, p + 'elements', false, true);
      } else {
        add(3, p + 'elements', s.elements.length > 0);
        s.elements.forEach((e, j) => {
          const ep = p + 'elements.' + j + '.';
          add(3, ep + 'name', filled(e.name));
          add(3, ep + 'definition', filled(e.definition), true);
          add(3, ep + 'why', filled(e.why), true);
          add(3, ep + 'key', keyCount(e) > 0, true);
        });
      }
    });
    if (usesAI(r)) { add(2, 'aiPrompts', filled(r.aiPrompts)); add(2, 'aiOversight', filled(r.aiOversight)); }
    return c;
  }
  const score = r => { const c = checklist(r); return { ok: c.filter(x => x.ok).length, total: c.length }; };
  const blocking = (r, step) => checklist(r).filter(x => !x.ok && !x.soft && (step == null || x.step === step));

  function questions(r) {
    const q = [];
    const ask = (who, text) => q.push({ who, text });
    const name = r.initiative.trim() || 'this initiative';
    const srcList = a => a.slice(0, 4).map(srcName).join(', ') + (a.length > 4 ? ' and ' + (a.length - 4) + ' more' : '');
    if (r.stage === 'explore' || r.stage === 'pilot' || !r.stage) ask('About the request', 'Is ' + name + ' funded and a priority for this year? What decision depends on this data?');
    if (!filled(r.tomorrow)) ask('About the request', 'If we delivered this data tomorrow in an automated way, what would you do with it?');
    if (usesAI(r) && (r.aiPrompts !== 'yes' || r.aiOversight !== 'yes')) ask('About the request', 'Which prompts or use cases are ready for the AI tool, and which function will review what it produces?');
    const noWhy = r.sources.filter(s => filled(s.priority) && !filled(s.priorityWhy));
    if (noWhy.length) ask('About the request', 'What is the rationale for the priority given to ' + srcList(noWhy) + '? It lets us compare priorities across teams.');
    const noUse = r.sources.filter(s => !filled(s.consumer));
    if (noUse.length) ask('About the request', 'What will consume the data from ' + srcList(noUse) + ': a report, dashboard, model, AI tool or analytics?');
    r.sources.forEach(s => {
      const n = srcName(s), c = cat(s.catalog), list = els(s);
      if (isReport(s)) ask(n, 'This looks like a report or dashboard. Which system feeds it?');
      else if (!list.length) ask(n, (filled(s.useCase) ? '' : 'What is the business use case for this source? ') + 'Which category of data and which specific fields do you need? Send any files or sample extracts you have.');
      else if (!filled(s.useCase)) ask(n, 'What is the business use case for this source?');
      const names = a => a.slice(0, 3).map(e => '"' + elName(e) + '"').join(', ') + (a.length > 3 ? ' and ' + (a.length - 3) + ' more' : '');
      const noKey = list.filter(e => keyCount(e) === 0);
      const summaries = list.filter(e => e.fieldType === 'summary' && !filled(e.key.element));
      const unsure = noKey.filter(e => e.fieldType !== 'field' && e.fieldType !== 'summary');
      if (noKey.length) ask(n, 'No part of the four-part key was given for ' + names(noKey) + '. Do you know the database, schema, table or element for ' + (noKey.length === 1 ? 'it' : 'any of them') + '?');
      if (summaries.length) ask(n, names(summaries) + (summaries.length === 1 ? ' is a summary' : ' are summaries') + '. Which individual fields make ' + (summaries.length === 1 ? 'it' : 'them') + ' up?');
      if (unsure.length) ask(n, (unsure.length === 1 ? 'Is ' + names(unsure) + ' one field or a summary of several?' : 'Are ' + names(unsure) + ' single fields or summaries of several?'));
      if (c && c.platforms.length) ask(n, 'We already source ' + c.fields + ' fields from ' + n + ' into ' + c.platforms.join(' and ') + '. Do those meet your need, and what else is missing?');
      if (list.length && s.golden !== 'golden' && !isReport(s)) ask(n, 'Is ' + n + ' the authoritative source for these fields, or is it where you see them today?');
      if (!filled(s.regulatory) || s.regulatory === 'unknown') ask(n, 'Is this need regulatory driven? Yes only if a regulation, regulatory commitment, exam finding or policy mandate requires it.');
      else if (s.regulatory === 'yes' && (!filled(s.regType) || !filled(s.regDetail))) ask(n, 'Which regulation, policy or exam finding requires this? Please cite it.');
      if (list.length && !filled(s.dataType)) ask(n, 'Do you need a snapshot at a point in time, or every transaction or event?');
      const lost = list.filter(e => /screenshot|extract/i.test(e.t.gap)), vague = list.filter(e => /where .*pull/i.test(e.t.gap));
      if (lost.length) ask(n, 'We could not find ' + names(lost) + ' in the data we hold. Can you send a screenshot from the system or a system extract so we can identify ' + (lost.length === 1 ? 'it' : 'them') + '?');
      if (vague.length) ask(n, 'We are not sure which application ' + names(vague) + (vague.length === 1 ? ' comes' : ' come') + ' from. Where do you pull ' + (vague.length === 1 ? 'it' : 'them') + ' from today?');
      if (s.reporting === 'yes' && !filled(s.audience)) ask(n, 'Who is the audience for the report this feeds?');
      if (s.history === 'yes' && (!filled(s.historyDepth) || /not sure/i.test(s.historyDepth))) ask(n, 'How far back do you need historical data?');
    });
    return q;
  }

  function demandRows() {
    const map = new Map();
    state.requests.forEach(r => r.sources.forEach(s => {
      const k = srcKey(s);
      if (!map.has(k)) map.set(k, { name: srcName(s), desc: srcDesc(s), c: cat(s.catalog), report: false, teams: new Set(), requests: 0, elements: 0, blank: 0 });
      const d = map.get(k);
      d.teams.add(r.team); d.requests++; d.elements += els(s).length; if (!els(s).length) d.blank++; if (isReport(s)) d.report = true;
    }));
    return [...map.values()].sort((a, b) => b.teams.size - a.teams.size || b.requests - a.requests || a.name.localeCompare(b.name));
  }

      '<dataValidations count="' + dv.length + '">' + dv.join('') + '</dataValidations></worksheet>';
    const help = ['How to fill this in', '1. Go to the PDE Requirements sheet.', '2. Fill in one row per data element, starting at row 6. The example row is ignored, so you can leave it or delete it.',
      '3. Source Application must match a source in your request' + (names.length ? ': ' + names.join('; ') + '.' : '.'),
      '4. Business Element Name is required on every row. Give the system field name, database, schema and table where you know them. Even two of the four help us find the element.',
      '5. Required or Nice-to-have: pick Required if the use case cannot work without the element.',
      '6. Save the file as .xlsx and upload it on the PDE requirements step. Uploading again replaces the rows from the last upload.'];
    const sheet2 = head + '<worksheet ' + ns + '><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols><col min="1" max="1" width="130" customWidth="1"/></cols><sheetData>' +
      help.map((t, i) => row(i + 1, cell(0, i + 1, t, i ? 0 : 1))).join('') + '</sheetData></worksheet>';
    const edge = '<color rgb="FFD0CECE"/>', side = k => '<' + k + ' style="thin">' + edge + '</' + k + '>';
    const styles = head + '<styleSheet ' + ns + '><fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FF1F3864"/><name val="Calibri"/></font>' +
      '<font><i/><sz val="10"/><color rgb="FF595959"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FF3F3F3F"/><name val="Calibri"/></font></fonts>' +
      '<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF9C6500"/><bgColor indexed="64"/></patternFill></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFFFF2CC"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEDEDED"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>' + side('left') + side('right') + side('top') + side('bottom') + '<diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '<xf numFmtId="0" fontId="3" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="2" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '<xf numFmtId="49" fontId="0" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    const rel = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships', pkg = 'http://schemas.openxmlformats.org/package/2006/relationships', ct = 'application/vnd.openxmlformats-officedocument.spreadsheetml.';
    return zipStore([
      ['[Content_Types].xml', head + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="' + ct + 'sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="' + ct + 'worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="' + ct + 'worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="' + ct + 'styles+xml"/></Types>'],
      ['_rels/.rels', head + '<Relationships xmlns="' + pkg + '"><Relationship Id="rId1" Type="' + rel + '/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', head + '<workbook ' + ns + ' xmlns:r="' + rel + '"><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="28800" windowHeight="14400"/></bookViews><sheets><sheet name="PDE Requirements" sheetId="1" r:id="rId1"/><sheet name="How to fill this in" sheetId="2" r:id="rId2"/></sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels', head + '<Relationships xmlns="' + pkg + '"><Relationship Id="rId1" Type="' + rel + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + rel + '/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="' + rel + '/styles" Target="styles.xml"/></Relationships>'],
      ['xl/worksheets/sheet1.xml', sheet1], ['xl/worksheets/sheet2.xml', sheet2], ['xl/styles.xml', styles]
    ]);
  }
  /* Inside the Claude viewer a page cannot start a download itself; it asks through the downloads capability. A saved copy of the page uses a normal link. */
  const framed = !!(window.claude && window.claude.use);
  const downloadsReady = framed ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  async function saveFile(filename, blob) {
    const dl = await downloadsReady;
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast('Template saved'); }
      catch (err) { const code = err && err.code; toast(code === 'declined' ? 'Download cancelled' : code === 'rate_limited' ? 'A download prompt is already open' : 'This view cannot save files. Open the page in a browser to download the template.'); }
      return;
    }
    const a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(framed ? 'Download started. If nothing was saved, downloads are blocked in this view.' : 'Template downloaded');
  }

  /* ================= render and events ================= */  /* ================= render and events ================= */
  const views = { request: viewRequest, mine: viewMine, howto: viewHowto, triage: viewTriage, demand: viewDemand, definitions: viewDefinitions };
  function signedOutView() {
    return '<section class="panel signin"><span class="avatar avatar-lg" aria-hidden="true">?</span><h1>You are signed out</h1>' +
      '<p class="muted">This is where the company sign-in goes. In the real tool your identity, team and access come from the company authentication system before this page loads.</p>' +
      '<button type="button" class="btn btn-primary" data-act="sign-in">Sign in with company single sign-on</button>' +
      '<p class="muted small">Placeholder only. This mockup never asks for a username or password.</p></section>';
  }
  function renderUser() {
    const u = me();
    if (!state.signedIn) { userbox.innerHTML = '<span class="user-out">Not signed in</span>'; return; }
    const row = x => '<button type="button" class="user-opt" data-user="' + x.id + '" aria-pressed="' + (x.id === u.id) + '"><span class="avatar" aria-hidden="true">' + esc(x.initials) + '</span><span><b>' + esc(x.name) + '</b><small>' + esc(x.team) + '</small></span></button>';
    userbox.innerHTML = '<button type="button" class="user-chip" id="user-chip" data-user-act="toggle" aria-expanded="' + state.menuOpen + '" aria-controls="user-menu"><span class="avatar" aria-hidden="true">' + esc(u.initials) + '</span>' +
      '<span class="user-id"><b>' + esc(u.name) + '</b><small>' + esc(u.team) + '</small></span><span class="caret" aria-hidden="true">▾</span></button>' +
      (state.menuOpen ? '<div class="user-menu" id="user-menu" role="group" aria-label="Your profile"><div class="user-head"><span class="avatar avatar-lg" aria-hidden="true">' + esc(u.initials) + '</span><div><b>' + esc(u.name) + '</b><span class="muted small">' + esc(u.email) + '</span></div></div>' +
        '<dl class="user-facts"><dt>Employee ID</dt><dd class="mono">' + esc(u.empId) + '</dd><dt>Team</dt><dd>' + esc(u.team) + '</dd><dt>Access</dt><dd>' + ROLE_NAME[u.role] + '</dd></dl>' +
        '<p class="muted small">Placeholder profile. In the real tool this comes from the company sign-in and directory, and your access decides which view you get.</p>' +
        '<p class="eyebrow">Demo: switch sample user</p><div class="user-list">' + USERS.map(row).join('') + '</div>' +
        '<button type="button" class="btn" data-user-act="signout">Sign out</button></div>' : '');
  }
  function render(focusId) {
    const a = document.activeElement, fid = focusId || (a && app.contains(a) ? a.id : '');
    renderUser();
    ['req', 'team'].forEach(k => { const b = document.getElementById('role-' + k); b.setAttribute('aria-pressed', String(state.signedIn && k === state.role)); b.disabled = !state.signedIn; });
    document.getElementById('tabbar').dataset.role = state.role;
    if (!state.signedIn) { app.innerHTML = signedOutView(); document.getElementById('tabs').innerHTML = ''; return; }
    app.innerHTML = views[state.view]();
    document.getElementById('tabs').innerHTML = ROLE_VIEWS[state.role].map(v => '<button class="tab" role="tab" id="tab-' + v[0] + '" data-view="' + v[0] + '" aria-selected="' + (v[0] === state.view) + '">' + v[1] +
      (v[0] === 'triage' || v[0] === 'mine' ? '<span class="count">' + (v[0] === 'triage' ? state.requests.length : state.requests.filter(r => r.team === state.mineTeam).length) + '</span>' : '') + '</button>').join('');
    if (fid) { const el = document.getElementById(fid); if (el) el.focus({ preventScroll: !focusId }); }
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function show(view) {
    if (!ROLE_VIEWS[state.role].some(v => v[0] === view)) setRole(ROLE_VIEWS.req.some(v => v[0] === view) ? 'req' : 'team');
    state.view = view; state.errors.clear();
    try { history.replaceState(null, '', '#' + view); } catch (_) { /* hash is a convenience only */ }
    render(); window.scrollTo(0, 0);
  }
  function goStep(n) {
    state.step = n; state.errors.clear(); render('step-h'); window.scrollTo(0, 0);
  }
  function flag(items) {
    state.errors = new Set(items.map(x => 'draft.' + x.path));
    const first = items[0].path, row = /^sources\.(\d+)\.elements\.(\d+)\./.exec(first);
    if (row) { const src = state.draft.sources[Number(row[1])]; src.editing = Number(row[2]); src.showAll = true; }
    render();
    const el = document.getElementById(idOf('draft.' + first)) || app.querySelector('.f-bad input, .f-bad select, .f-bad textarea, .err');
    if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus({ preventScroll: true }); }
    toast(items.length === 1 ? '1 answer is missing on this step' : items.length + ' answers are missing on this step');
  }
  function copyText(text, msg) {
    const done = () => toast(msg || 'Questions copied');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      if (ok) done(); else toast('Copy is blocked here. Select the list and copy it by hand.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  const actions = {
    'go-step': t => goStep(Number(t.dataset.step)),
    back: () => goStep(state.step - 1),
    next: () => { const m = blocking(state.draft, state.step); if (m.length) flag(m); else goStep(state.step + 1); },
    submit: () => {
      const m = blocking(state.draft);
      if (m.length) { state.step = Math.min(...m.map(x => x.step)); flag(m.filter(x => x.step === state.step)); return; }
      const r = state.draft;
      r.id = 'SUB-' + String(state.nextNum++).padStart(4, '0');
      r.example = false; r.status = 'Not started'; r.submitted = new Date().toISOString().slice(0, 10);
      r.sources.forEach(s => { s.t.call = ''; });
      prepRequest(r);
      state.requests.unshift(r); fillOthers(r); state.picked = r.id; state.submittedId = r.id; state.mineTeam = r.team;
      state.draft = newRequest({ sources: [{}] }); state.step = 0; state.errors.clear();
      render(); window.scrollTo(0, 0);
    },
    'add-source': () => { state.draft.sources.push(newSource()); state.errors.delete('draft.sources'); render(); },
    'rm-source': t => { state.draft.sources.splice(Number(t.dataset.i), 1); state.errors.clear(); render(); },
    'add-el': t => { const i = Number(t.dataset.i), s = state.draft.sources[i]; s.elements.push(newElement()); s.editing = s.elements.length - 1; s.showAll = true; state.errors.delete('draft.sources.' + i + '.elements'); render(idOf('draft.sources.' + i + '.elements.' + (s.elements.length - 1) + '.name')); },
    'rm-el': t => { const s = state.draft.sources[Number(t.dataset.i)], j = Number(t.dataset.j); s.elements.splice(j, 1); s.editing = s.editing === j ? -1 : s.editing > j ? s.editing - 1 : s.editing; state.errors.clear(); render(); },
    'edit-el': t => { const s = state.draft.sources[Number(t.dataset.i)], j = Number(t.dataset.j); s.editing = s.editing === j ? -1 : j; render('edit-' + t.dataset.i + '-' + j); },
    'show-all': t => { const s = state.draft.sources[Number(t.dataset.i)]; s.showAll = !s.showAll; render(); },
    'team-show-all': t => { const s = state.requests[Number(t.dataset.r)].sources[Number(t.dataset.s)]; s.tAll = !s.tAll; render(); },
    'dl-template': () => saveFile('PDE-requirements-template.xlsx', buildTemplate(state.draft.sources)),
    'clear-draft': () => { state.draft = newRequest({ sources: [{}] }); state.step = 0; state.errors.clear(); render(); toast('Form cleared'); },
    'load-example': () => { state.draft = exampleDraft(); state.errors.clear(); render(); },
    'open-triage': () => { state.submittedId = ''; show('triage'); },
    'sign-in': () => { state.signedIn = true; render(); },
    'see-mine': () => { state.submittedId = ''; show('mine'); },
    'draft-next': t => {
      const r = state.requests[Number(t.dataset.r)], s = r.sources[Number(t.dataset.s)], list = questions(r).filter(q => q.who === srcName(s));
      s.t.next = list.length ? list.map(q => '- ' + q.text).join('\n') : 'No open questions. Ready for the next step.';
      stamp('requests.' + t.dataset.r + '.sources.' + t.dataset.s + '.t.next');
      render(idOf('requests.' + t.dataset.r + '.sources.' + t.dataset.s + '.t.next'));
    },
    'new-request': () => { state.submittedId = ''; render(); },
    pick: t => { state.picked = t.dataset.id; render(); },
    'pick-src': t => { state.requests[Number(t.dataset.r)].sel = Number(t.dataset.s); render(); },
    'add-held': t => {
      const i = Number(t.dataset.i), s = state.draft.sources[i], h = cat(s.catalog).held, col = h.cols[Number(t.dataset.n)];
      s.elements = s.elements.filter(e => filled(e.name) || keyCount(e) > 0 || filled(e.definition));
      s.elements.push(newElement({ name: col[1], fieldType: 'field', key: { db: h.db, schema: h.schema, table: h.table, element: col[0] } }));
      s.heldOpen = true; state.errors.clear(); render();
    },
    'see-example': () => { state.draft = exampleDraft(); state.submittedId = ''; state.step = 0; show('request'); },
    'start-blank': () => { state.draft = newRequest({ sources: [{}] }); state.submittedId = ''; state.step = 0; show('request'); },
    'copy-q': t => { const r = state.requests[Number(t.dataset.r)]; copyText('Questions on ' + r.id + ' ' + r.title + '\n\n' + groupQ(questions(r)).map(g => g.who + '\n' + g.items.map(t => '- ' + t).join('\n')).join('\n\n')); }
  };

  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || !app.contains(t)) return;
    actions[t.dataset.act](t);
  });
  app.addEventListener('input', e => {
    const t = e.target, p = t.dataset.bind;
    let p0 = '';
    if (!p || t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT') return;
    set(p, t.value); stamp(p);
    if (p.endsWith('.t.others')) { const n = document.getElementById(idOf(p) + '-n'); if (n) n.textContent = countTeams(t.value); }
    let holder = t;
    if (p.includes('.key.')) {
      const ep = p.split('.key.')[0], chip = t.closest('.keyset').querySelector('.chip');
      if (chip) chip.outerHTML = keyChip(get(ep));
    }
    if (state.errors.delete(p0 || p)) { const f = holder.closest('.f'); if (f) { f.classList.remove('f-bad'); const er = f.querySelector('.err'); if (er) er.remove(); } }
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.upload) { importAll(t.files[0]); return; }
    if (t.dataset.bindset) {
      const p = t.dataset.bindset, arr = get(p), i = arr.indexOf(t.value);
      if (t.checked && i < 0) arr.push(t.value); else if (!t.checked && i >= 0) arr.splice(i, 1);
      state.errors.delete(p); render(); return;
    }
    const p = t.dataset.bind;
    if (!p) return;
    if (t.type === 'checkbox') set(p, t.checked);
    else if (t.type === 'radio' || t.tagName === 'SELECT') set(p, t.value);
    else return;
    stamp(p);
    if (/^draft\.sources\.\d+\.catalog$/.test(p)) { const c = cat(t.value); get(p.replace(/\.catalog$/, '')).appId = c ? c.appId : ''; }
    state.errors.delete(p); render();
  });
  app.addEventListener('toggle', e => { const p = e.target.dataset && e.target.dataset.open; if (p) set(p, e.target.open); }, true);
  document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('[data-view]'); if (t) show(t.dataset.view); });
  document.querySelector('.role-sw').addEventListener('click', e => { const t = e.target.closest('[data-role]'); if (t && state.signedIn && t.dataset.role !== state.role) { setRole(t.dataset.role); show(ROLE_VIEWS[state.role][0][0]); } });
  userbox.addEventListener('click', e => {
    const opt = e.target.closest('[data-user]'), act = e.target.closest('[data-user-act]');
    if (opt) { setUser(opt.dataset.user); state.menuOpen = false; state.submittedId = ''; show(ROLE_VIEWS[state.role][0][0]); document.getElementById('user-chip').focus(); }
    else if (act && act.dataset.userAct === 'toggle') { state.menuOpen = !state.menuOpen; renderUser(); document.getElementById('user-chip').focus(); }
    else if (act && act.dataset.userAct === 'signout') { state.signedIn = false; state.menuOpen = false; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener('click', e => { if (state.menuOpen && !e.composedPath().includes(userbox)) { state.menuOpen = false; renderUser(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.menuOpen) { state.menuOpen = false; renderUser(); document.getElementById('user-chip').focus(); } });

  const start = (location.hash || '').slice(1);
  if (VIEWS.includes(start)) { state.view = start; if (!ROLE_VIEWS.req.some(v => v[0] === start)) setRole('team'); }
  render();
})();
</script>
</body>
</html>
